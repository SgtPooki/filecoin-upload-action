name: Validate Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: Lint and type checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting and type checking
        run: npm run lint

  validate-yaml:
    name: Validate YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: action.yml examples/ .github
          format: github
          strict: true
          # .yamllint config file is automatically used

  test-action-loading:
    name: Test action loading and execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate action can be loaded and executed
        uses: ./
        id: test-load
        continue-on-error: true
        with:
          path: ./examples
          walletPrivateKey: "INVALID_PRIVATE_KEY"  # Dummy key for validation
          network: calibration
          minStorageDays: "0"  # No storage days to avoid payment logic
          filecoinPayBalanceLimit: "0"  # Small limit for validation

      - name: Check validation result
        if: always()
        run: |
          # Get the step output for parsing
          echo "=== Parsing action output for validation ==="

          # Check if action succeeded (should NOT happen with dummy wallet)
          if [ "${{ steps.test-load.outcome }}" == "success" ]; then
            echo "❌ SECURITY ISSUE: Action succeeded with dummy wallet key!"
            echo "This should never happen - the dummy wallet key should cause upload to fail"
            exit 1
          fi

          # Parse the output to validate specific success indicators
          echo "Checking for build phase success indicators..."

          # Check for IPFS Root CID generation (build phase success)
          if echo "${{ steps.test-load.outputs }}" | grep -q "IPFS Root CID:"; then
            echo "✅ Build phase succeeded: IPFS Root CID generated"
            # Extract and display the CID
            CID=$(echo "${{ steps.test-load.outputs }}" | grep "IPFS Root CID:" | sed 's/.*IPFS Root CID: //' | head -1)
            echo "   Generated CID: $CID"
          else
            echo "❌ Build phase failed: No IPFS Root CID found in output"
            exit 1
          fi

          # Check for CAR file creation
          if echo "${{ steps.test-load.outputs }}" | grep -q "CAR file size:"; then
            echo "✅ Build phase succeeded: CAR file created"
            # Extract and display the size
            SIZE=$(echo "${{ steps.test-load.outputs }}" | grep "CAR file size:" | sed 's/.*CAR file size: //' | head -1)
            echo "   CAR file size: $SIZE"
          else
            echo "❌ Build phase failed: No CAR file size found in output"
            exit 1
          fi

          # Check for early wallet validation failure (expected with dummy wallet)
          if echo "${{ steps.test-load.outputs }}" | grep -q "Invalid wallet private key format"; then
            echo "✅ Wallet validation failed early as expected: Invalid private key format detected"
          else
            echo "❌ Expected early wallet validation failure not found"
            echo "Looking for: 'Invalid wallet private key format'"
            echo "This means the dummy wallet key was accepted, which is a security issue"
            exit 1
          fi

          # Final validation
          if [ "${{ steps.test-load.outcome }}" == "failure" ]; then
            echo ""
            echo "🎉 VALIDATION PASSED:"
            echo "✅ Build phase succeeded (CAR created, IPFS Root CID generated)"
            echo "✅ Wallet validation failed early (no network calls made)"
            echo "✅ Security validation: Action requires valid wallet credentials"
            echo "✅ Performance validation: Invalid keys rejected before expensive operations"
          else
            echo "⚠️ Action was skipped or cancelled"
            exit 1
          fi
